[project]
name = "apollo-evals"
version = "0.2.0"
description = "Native Harbor tasks for evaluating agent harness and model combinations on Apollo"
requires-python = ">=3.12"
dependencies = ["harbor==0.22.0"]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
exclude = ["tasks"]
